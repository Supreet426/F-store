<header class="h-16 border-b border-slate-800/80 bg-slate-900/95 backdrop-blur-md px-3 sm:px-6 flex items-center justify-between sticky top-0 z-50 shrink-0 shadow-md gap-3">
    <!-- Left Section: Navigation Controls & Active Page Title -->
    <div class="flex items-center gap-2.5 min-w-0 shrink-0">
        <button id="btn-toggle-drawer" onclick="toggleDrawer()" title="Toggle Navigation Drawer" class="w-9 h-9 rounded-xl bg-slate-800/80 hover:bg-slate-800 border border-slate-700/80 text-white flex items-center justify-center transition-all cursor-pointer group shadow-sm shrink-0">
            <i id="drawer-toggle-icon" class="fa-solid fa-bars text-sm text-slate-300 group-hover:text-brand-400"></i>
        </button>
        <button onclick="goBack()" title="Go Back" class="w-9 h-9 rounded-xl bg-slate-800/80 hover:bg-slate-800 border border-slate-700/80 text-slate-300 hover:text-white flex items-center justify-center transition-all cursor-pointer shadow-sm shrink-0">
            <i class="fa-solid fa-arrow-left text-xs text-brand-400"></i>
        </button>
        <div class="w-7 h-7 bg-gradient-to-tr from-brand-600 to-amber-500 rounded-lg flex items-center justify-center shadow-sm shrink-0">
            <i class="fa-solid fa-bolt text-xs text-white"></i>
        </div>
        <div class="h-4 w-px bg-slate-800 hidden sm:block shrink-0"></div>
        <h2 id="page-title" class="text-sm sm:text-base font-black text-white tracking-wide truncate max-w-[180px] sm:max-w-none">Product Catalog & Inventory</h2>
    </div>

    <!-- Center/Actions Section: SHIFTED ALL TAB ACTION BUTTONS DIRECTLY TO TITLE BAR -->
    <div id="header-actions-container" class="flex items-center gap-2 flex-nowrap overflow-x-auto py-1 no-scrollbar shrink">
        <!-- Dynamically injected per active tab -->
    </div>

    <!-- Right Section: Refresh Sync -->
    <div class="flex items-center gap-2 shrink-0">
        <button onclick="window.location.reload()" title="Refresh Sync" class="w-9 h-9 sm:w-auto bg-slate-800/80 hover:bg-slate-800 text-slate-300 hover:text-white text-xs px-3 py-2 rounded-xl transition-all flex items-center justify-center gap-1.5 border border-slate-700/80 cursor-pointer">
            <i class="fa-solid fa-rotate text-brand-400"></i>
            <span class="hidden sm:inline">Refresh Sync</span>
        </button>
    </div>
</header>
