<!-- SECURE AUTHENTICATION OVERLAY FOR ADMINS, MERCHANTS & STAFF -->
<div id="login-overlay" class="fixed inset-0 z-[200] flex items-center justify-center bg-slate-950/95 backdrop-blur-md p-4 overflow-y-auto">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-5 relative overflow-hidden my-auto text-center">

        <!-- Decorative Background Glow -->
        <div class="absolute -top-16 -right-16 w-48 h-48 bg-rose-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-16 -left-16 w-48 h-48 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header Branding -->
        <div class="space-y-2">
            <div class="w-14 h-14 bg-gradient-to-tr from-rose-600 to-rose-500 rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-rose-600/30 ring-4 ring-rose-500/10">
                <i class="fa-solid fa-store text-2xl text-white"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-white tracking-tight">Flash-O Merchant Portal</h2>
            <p id="auth-subtitle" class="text-xs text-slate-400 max-w-xs mx-auto">Sign in for Admins, Store Owners & Staff Members</p>
        </div>

        <!-- Auth Mode Tabs (Sign In / Register) -->
        <div class="bg-slate-950 p-1 rounded-2xl flex border border-slate-800 text-center gap-1">
            <button type="button" id="tab-login-btn" onclick="if(window.switchAuthTab)window.switchAuthTab('login')" class="flex-1 py-2 text-xs font-semibold rounded-xl transition-all bg-rose-600 text-white shadow-md shadow-rose-600/20">
                Sign In
            </button>
            <button type="button" id="tab-register-btn" onclick="if(window.switchAuthTab)window.switchAuthTab('register')" class="flex-1 py-2 text-xs font-semibold rounded-xl transition-all text-slate-400 hover:text-white">
                Register Store
            </button>
        </div>

        <!-- Error Alert Message -->
        <div id="login-error-msg" class="hidden p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs flex items-center gap-2.5 text-left">
            <i class="fa-solid fa-circle-exclamation text-rose-400 shrink-0 text-sm"></i>
            <span id="login-error-text" class="leading-relaxed">Authentication failed.</span>
        </div>

        <!-- LOGIN FORM -->
        <form id="login-form" onsubmit="if(window.handleAdminLogin)return window.handleAdminLogin(event); return false;" class="space-y-4">
            <div class="space-y-1.5 text-left">
                <label for="login-email" class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Email or Username</label>
                <div class="relative">
                    <input type="text" id="login-email" placeholder="email@domain.com or Mobile" class="w-full bg-slate-950/80 border border-slate-800 focus:border-rose-500 text-white text-sm rounded-xl px-4 py-3 pl-10 focus:outline-none focus:ring-1 focus:ring-rose-500 transition-all placeholder:text-slate-600" required>
                    <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
                </div>
            </div>

            <div class="space-y-1.5 text-left">
                <div class="flex justify-between items-center">
                    <label for="login-password" class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Password</label>
                    <button type="button" id="forgot-pass-btn" onclick="if(window.handleForgotPassword)window.handleForgotPassword()" class="text-[11px] text-rose-400 hover:text-rose-300 hover:underline focus:outline-none">Forgot?</button>
                </div>
                <div class="relative">
                    <input type="password" id="login-password" placeholder="••••••••" class="w-full bg-slate-950/80 border border-slate-800 focus:border-rose-500 text-white text-sm rounded-xl px-4 py-3 pl-10 pr-10 focus:outline-none focus:ring-1 focus:ring-rose-500 transition-all placeholder:text-slate-600" required>
                    <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
                    <button type="button" id="login-pass-toggle-btn" onclick="if(window.togglePasswordVisibility)window.togglePasswordVisibility('login-password','login-pass-eye')" class="absolute right-3.5 top-3.5 text-slate-500 hover:text-slate-300 text-sm focus:outline-none">
                        <i id="login-pass-eye" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="login-submit-btn" class="w-full bg-gradient-to-r from-rose-600 to-rose-500 hover:from-rose-500 hover:to-rose-600 text-white font-bold text-sm py-3.5 px-4 rounded-xl transition-all flex items-center justify-center gap-2 cursor-pointer shadow-lg shadow-rose-600/25 active:scale-[0.98]">
                <i id="login-btn-icon" class="fa-solid fa-right-to-bracket"></i>
                <i id="login-spinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
                <span id="login-btn-text">Sign In to Dashboard</span>
            </button>
        </form>

        <!-- REGISTER FORM (Hidden by default) -->
        <form id="register-form" onsubmit="if(window.handleAdminRegister)return window.handleAdminRegister(event); return false;" class="space-y-3.5 hidden">
            <div class="space-y-1.5 text-left">
                <label for="reg-name" class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Store / Full Name</label>
                <div class="relative">
                    <input type="text" id="reg-name" placeholder="My Store Name" class="w-full bg-slate-950/80 border border-slate-800 focus:border-rose-500 text-white text-sm rounded-xl px-4 py-2.5 pl-10 focus:outline-none focus:ring-1 focus:ring-rose-500 transition-all placeholder:text-slate-600">
                    <i class="fa-solid fa-store absolute left-3.5 top-3 text-slate-500 text-sm"></i>
                </div>
            </div>

            <div class="space-y-1.5 text-left">
                <label for="reg-phone" class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Mobile Number</label>
                <div class="relative">
                    <input type="tel" id="reg-phone" maxlength="10" placeholder="9876543210" class="w-full bg-slate-950/80 border border-slate-800 focus:border-rose-500 text-white text-sm rounded-xl px-4 py-2.5 pl-10 focus:outline-none focus:ring-1 focus:ring-rose-500 transition-all placeholder:text-slate-600">
                    <i class="fa-solid fa-phone absolute left-3.5 top-3 text-slate-500 text-sm"></i>
                </div>
            </div>

            <div class="space-y-1.5 text-left">
                <label for="reg-email" class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Business Email</label>
                <div class="relative">
                    <input type="email" id="reg-email" placeholder="partner@store.com" class="w-full bg-slate-950/80 border border-slate-800 focus:border-rose-500 text-white text-sm rounded-xl px-4 py-2.5 pl-10 focus:outline-none focus:ring-1 focus:ring-rose-500 transition-all placeholder:text-slate-600">
                    <i class="fa-solid fa-envelope absolute left-3.5 top-3 text-slate-500 text-sm"></i>
                </div>
            </div>

            <div class="space-y-1.5 text-left">
                <label for="reg-password" class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Password (Min 6 chars)</label>
                <div class="relative">
                    <input type="password" id="reg-password" placeholder="••••••••" class="w-full bg-slate-950/80 border border-slate-800 focus:border-rose-500 text-white text-sm rounded-xl px-4 py-2.5 pl-10 pr-10 focus:outline-none focus:ring-1 focus:ring-rose-500 transition-all placeholder:text-slate-600">
                    <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-500 text-sm"></i>
                    <button type="button" id="reg-pass-toggle-btn" onclick="if(window.togglePasswordVisibility)window.togglePasswordVisibility('reg-password','reg-pass-eye')" class="absolute right-3.5 top-3 text-slate-500 hover:text-slate-300 text-sm focus:outline-none">
                        <i id="reg-pass-eye" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="reg-submit-btn" class="w-full bg-gradient-to-r from-rose-600 to-rose-500 hover:from-rose-500 hover:to-rose-600 text-white font-bold text-sm py-3.5 px-4 rounded-xl transition-all flex items-center justify-center gap-2 cursor-pointer shadow-lg shadow-rose-600/25 active:scale-[0.98]">
                <i id="reg-btn-icon" class="fa-solid fa-user-plus"></i>
                <i id="reg-spinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
                <span id="reg-btn-text">Create Partner Account</span>
            </button>
        </form>

        <!-- Divider -->
        <div class="relative flex py-0.5 items-center">
            <div class="flex-grow border-t border-slate-800"></div>
            <span class="flex-shrink mx-3 text-[10px] font-bold text-slate-500 uppercase tracking-widest">OR</span>
            <div class="flex-grow border-t border-slate-800"></div>
        </div>

        <!-- Google Sign-In Button -->
        <div>
            <button type="button" id="google-login-btn" onclick="if(window.handleGoogleLogin)window.handleGoogleLogin()" class="w-full bg-slate-800 hover:bg-slate-750 border border-slate-700 text-white font-bold text-sm py-3 px-4 rounded-xl transition-all flex items-center justify-center gap-3 cursor-pointer shadow-lg shadow-black/20 hover:border-slate-600 active:scale-[0.98]">
                <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Continue with Google</span>
            </button>
        </div>

        <div class="pt-2 border-t border-slate-800 text-center text-[11px] text-slate-500 leading-relaxed">
            Restricted portal for authorized Merchants, Store Owners, Admins & Staff.
        </div>
    </div>
</div>
