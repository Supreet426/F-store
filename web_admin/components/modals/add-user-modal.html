<div id="modal-add-user" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-4">
        <h3 class="text-lg font-bold text-white">Create New User Account</h3>
        <form id="form-add-user" class="space-y-3">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1" for="add-user-name">Full Name</label>
                <input type="text" id="add-user-name" required class="input-field" placeholder="John Doe">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1" for="add-user-phone">Mobile Number</label>
                <input type="tel" id="add-user-phone" required class="input-field" placeholder="9876543210">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1" for="add-user-email">Email Address</label>
                <input type="email" id="add-user-email" required class="input-field" placeholder="user@flash-o.com">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1" for="add-user-pass">Initial Password</label>
                <input type="password" id="add-user-pass" minlength="6" required class="input-field" placeholder="••••••••">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1" for="add-user-role">Account Role</label>
                <select id="add-user-role" onchange="document.getElementById('dept-select-wrap').style.display = this.value === 'OTHER' ? 'block' : 'none'" class="input-field">
                    <option value="MERCHANT">Merchant / Store Owner</option>
                    <option value="RIDER">Delivery Partner (Rider)</option>
                    <option value="CUSTOMER">Customer</option>
                    <option value="OTHER">Staff / Tech Worker</option>
                </select>
            </div>
            <div id="dept-select-wrap" style="display:none;">
                <label class="block text-xs font-semibold text-slate-400 mb-1" for="add-user-dept">Staff Department</label>
                <select id="add-user-dept" class="input-field">
                    <option value="Helpline & Customer Support">Helpline & Customer Support</option>
                    <option value="Cancellation Management">Cancellation Management</option>
                    <option value="Website Management">Website Management</option>
                    <option value="Advertisement & Marketing">Advertisement & Marketing</option>
                    <option value="Technical Operations">Technical Operations</option>
                </select>
            </div>
            <div class="flex justify-end gap-3 pt-2">
                <button type="button" onclick="closeAddUserModal()" class="px-4 py-2 text-xs font-bold text-slate-400 hover:text-white">Cancel</button>
                <button type="submit" class="btn-primary text-xs px-5 py-2">Create Account</button>
            </div>
        </form>
    </div>
</div>
