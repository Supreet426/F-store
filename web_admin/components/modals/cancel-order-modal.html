<div id="modal-cancel-order" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-4">
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
            <h3 class="text-base font-bold text-rose-400 flex items-center gap-2">
                <i class="fa-solid fa-ban"></i> Cancel Order Execution
            </h3>
            <button type="button" onclick="closeCancelOrderModal()" class="text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <form id="form-cancel-order" onsubmit="submitCancelOrder(event)" class="space-y-4">
            <input type="hidden" id="cancel-order-id">

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1" for="cancel-reason-select">Select Cancellation Reason</label>
                <select id="cancel-reason-select" class="input-field bg-slate-950 border-slate-800 focus:border-rose-500">
                    <option value="Customer requested cancellation">Customer requested cancellation</option>
                    <option value="Items out of stock in dark store">Items out of stock in dark store</option>
                    <option value="No delivery rider available">No delivery rider available in zone</option>
                    <option value="Incorrect delivery address / distance too far">Incorrect delivery address / distance too far</option>
                    <option value="Merchant store closed / unresponsive">Merchant store closed / unresponsive</option>
                    <option value="Other">Other Reason (Specify below)</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1" for="cancel-reason-custom">Detailed Explanation (Optional)</label>
                <textarea id="cancel-reason-custom" rows="2" class="input-field text-xs bg-slate-950 border-slate-800 focus:border-rose-500" placeholder="Provide extra detail for customer audit..."></textarea>
            </div>

            <div class="flex justify-end gap-3 pt-3 border-t border-slate-800">
                <button type="button" onclick="closeCancelOrderModal()" class="px-4 py-2 text-xs font-bold text-slate-400 hover:text-white">Keep Order Active</button>
                <button type="submit" class="px-5 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs flex items-center gap-2 cursor-pointer shadow-lg shadow-rose-900/30">
                    <i class="fa-solid fa-ban"></i> Confirm Cancellation
                </button>
            </div>
        </form>
    </div>
</div>
