<div id="modal-print-invoice" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4 overflow-y-auto">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-4 my-auto">
        <div class="flex justify-between items-center border-b border-slate-800 pb-3 no-print">
            <h3 class="text-base font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-print text-brand-400"></i> Order Packing Slip / Invoice
            </h3>
            <button type="button" onclick="closePrintInvoiceModal()" class="text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <!-- Printable Slip Content Container -->
        <div id="invoice-slip-content" class="text-xs text-slate-200 space-y-3 font-mono">
            <!-- Dynamically populated by JS -->
        </div>

        <div class="flex justify-end gap-3 pt-3 border-t border-slate-800 no-print">
            <button type="button" onclick="closePrintInvoiceModal()" class="px-4 py-2 text-xs font-bold text-slate-400 hover:text-white">Close</button>
            <button type="button" onclick="window.print()" class="btn-primary text-xs px-5 py-2 flex items-center gap-2">
                <i class="fa-solid fa-print"></i> Print Slip
            </button>
        </div>
    </div>
</div>
