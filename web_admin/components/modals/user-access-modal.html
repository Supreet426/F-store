<!-- MODAL: USER ACCESS GOVERNANCE & ROLES -->
<div id="modal-user-access" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-lg shadow-2xl space-y-4">
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
            <h3 class="text-base font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-user-shield text-amber-400"></i> User Access & Governance
            </h3>
            <button type="button" onclick="closeUserAccessModal()" class="text-slate-400 hover:text-white cursor-pointer">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <form id="form-user-access" class="space-y-4">
            <input type="hidden" id="access-user-uid">

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1" for="access-user-role">Role Permission Level</label>
                <select id="access-user-role" class="input-field bg-slate-950 border-slate-800 focus:border-amber-500">
                    <option value="CUSTOMER">Customer (Standard App User)</option>
                    <option value="MERCHANT">Store Merchant / Seller</option>
                    <option value="RIDER">Delivery Rider</option>
                    <option value="OTHER">Staff / Support Worker</option>
                    <option value="ADMIN">Platform Super Admin</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1" for="access-user-status">Account Account Status</label>
                <select id="access-user-status" class="input-field bg-slate-950 border-slate-800">
                    <option value="ACTIVE">Active & Allowed</option>
                    <option value="SUSPENDED">Suspended / Frozen</option>
                    <option value="PENDING">Pending Verification</option>
                </select>
            </div>

            <div class="flex justify-end gap-3 pt-3 border-t border-slate-800">
                <button type="button" onclick="closeUserAccessModal()" class="px-4 py-2 text-xs font-bold text-slate-400 hover:text-white cursor-pointer">Cancel</button>
                <button type="submit" class="btn-primary text-xs px-5 py-2 flex items-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-floppy-disk"></i> Update Permissions
                </button>
            </div>
        </form>
    </div>
</div>
