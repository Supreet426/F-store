<!-- MODAL: ASSIGN RIDER TO ORDER -->
<div id="modal-assign-rider" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-lg shadow-2xl space-y-4">
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
            <div>
                <h3 class="text-lg font-bold text-white"><i class="fa-solid fa-motorcycle text-sky-400 mr-2"></i>Assign Delivery Rider</h3>
                <p id="assign-rider-order-id" class="text-xs font-mono text-slate-400">Order #---</p>
            </div>
            <button type="button" onclick="closeAssignRiderModal()" class="text-slate-400 hover:text-white p-1 cursor-pointer">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <form id="form-assign-rider" class="space-y-4">
            <input type="hidden" id="assign-rider-target-order-id">

            <!-- Select Registered Rider -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1" for="assign-rider-select">Select On-Duty Fleet Rider</label>
                <select id="assign-rider-select" class="input-field bg-slate-800 text-white font-medium">
                    <option value="">-- Choose Registered Rider --</option>
                </select>
                <p class="text-[11px] text-slate-500 mt-1">Select an active rider or enter details manually below</p>
            </div>

            <div class="relative flex py-1 items-center">
                <div class="flex-grow border-t border-slate-800"></div>
                <span class="flex-shrink mx-3 text-[10px] text-slate-500 font-bold uppercase tracking-wider">or custom details</span>
                <div class="flex-grow border-t border-slate-800"></div>
            </div>

            <!-- Manual Rider Entry -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1" for="assign-rider-name">Rider Full Name</label>
                    <input type="text" id="assign-rider-name" class="input-field" placeholder="e.g. Rahul Sharma">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1" for="assign-rider-phone">Rider Mobile Number</label>
                    <input type="tel" id="assign-rider-phone" class="input-field" placeholder="e.g. +91 98765 43210">
                </div>
            </div>

            <!-- Auto Dispatch Toggle -->
            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 flex items-center justify-between">
                <div>
                    <span class="text-xs font-bold text-white block">Auto-Update Order Status</span>
                    <span class="text-[10px] text-slate-400">Automatically mark status as DISPATCHED</span>
                </div>
                <input type="checkbox" id="assign-rider-auto-dispatch" checked class="w-4 h-4 rounded accent-emerald-500 cursor-pointer">
            </div>

            <div class="flex justify-between items-center pt-2 border-t border-slate-800">
                <button type="button" onclick="unassignRiderFromOrder()" id="btn-unassign-rider" class="px-3 py-2 text-xs font-bold text-rose-400 hover:text-rose-300 hover:bg-rose-950/40 rounded-xl border border-rose-900/50 hidden cursor-pointer">
                    <i class="fa-solid fa-user-minus mr-1"></i> Remove Rider
                </button>
                <div class="flex gap-3 ml-auto">
                    <button type="button" onclick="closeAssignRiderModal()" class="px-4 py-2 text-xs font-bold text-slate-400 hover:text-white cursor-pointer">Cancel</button>
                    <button type="submit" class="btn-primary text-xs px-5 py-2 flex items-center gap-1.5 cursor-pointer">
                        <i class="fa-solid fa-paper-plane text-xs"></i> Assign & Confirm
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
